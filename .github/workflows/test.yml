name: Workspace checks

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git submodule status
      - run: python3 -m unittest discover -s tests -p 'test_monitoring*.py'
      - name: Validate monitoring rules and dashboard PromQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y prometheus
          python3 tests/test_monitoring_dashboards.py --promql > "$RUNNER_TEMP/dashboard-queries.json"
          promtool check rules "$RUNNER_TEMP/dashboard-queries.json"
          python3 tests/test_monitoring_dashboards.py --promql-tests > "$RUNNER_TEMP/dashboard-semantics.json"
          promtool test rules "$RUNNER_TEMP/dashboard-semantics.json"
          promtool check rules monitoring/prometheus/rules.yml
          promtool test rules monitoring/prometheus/rules.test.yml
          promtool check rules monitoring/deployments/rules.yml
          promtool test rules monitoring/deployments/rules.test.yml
          python3 tests/test_monitoring_deployment_dashboards.py --promql > "$RUNNER_TEMP/deployment-dashboard-queries.json"
          promtool check rules "$RUNNER_TEMP/deployment-dashboard-queries.json"
          python3 tests/test_monitoring_deployment_dashboards.py --promql-tests > "$RUNNER_TEMP/deployment-dashboard-semantics.json"
          promtool test rules "$RUNNER_TEMP/deployment-dashboard-semantics.json"
      - run: make test-dev-cleanup
      - run: make test-dev-cleanup-alert
      - run: make check-compose
      - run: make check-staging
      - run: make check-local-staging
      - run: make check-quick-staging
      - name: Verify official immutable Quick Tunnel CLI offline
        shell: bash
        run: |
          image="$(python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('quick', 'scripts/validate-quick-staging.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.CLOUDFLARED_IMAGE)
          PY
          )"
          trap 'status=$?; if (( status != 0 )); then echo "::error title=Quick CLI offline probe::Failed command: $BASH_COMMAND"; fi' EXIT
          docker pull "$image"
          docker run --rm --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges:true "$image" version \
            | grep 'cloudflared version 2026.10.0'
          docker run --rm --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges:true "$image" tunnel --loglevel fatal --metrics 0.0.0.0:2000 --url http://frontend:3000 --help \
            > "$RUNNER_TEMP/quick-help.txt"
          grep -- '--loglevel' "$RUNNER_TEMP/quick-help.txt"
          grep -- '--metrics' "$RUNNER_TEMP/quick-help.txt"
          python3 tests/check_monitoring_docker.py "$image"
      - name: Verify fresh staging PostGIS visibility and GIS DDL
        run: make test-staging-postgis
      - name: Verify cleanup wait compatibility with Compose 2.35.1
        shell: bash
        run: |
          compose_binary="$RUNNER_TEMP/docker-compose-2.35.1"
          curl --fail --silent --show-error --location \
            https://github.com/docker/compose/releases/download/v2.35.1/docker-compose-linux-x86_64 \
            --output "$compose_binary"
          echo "7bdb2ce2916e5dd0354e5d129892bf96fdcdb1a9ab8eed69b9173e131db4c230  $compose_binary" | sha256sum --check
          chmod +x "$compose_binary"
          COMPOSE_235_BINARY="$compose_binary" make test-staging-cleanup test-dev-cleanup-compose

  viewport-pan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Exercise the real cross-app viewport pan
        run: make test-e2e

  submission-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Exercise the real cross-app submission and media E2E
        run: make test-e2e-submission-media

  public-after-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Exercise the public-after-approval media lifecycle E2E
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          set +e
          make test-e2e-public-media 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure_tail="$(tail -n 80 "$log_file" | awk '{gsub(/%/, "%25"); printf "%s%%0A", $0}')"
            echo "::error title=public-after-approval failure::$failure_tail"
          fi
          exit "$status"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with redacted findings
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
