name: smokemap

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smokemap}
      POSTGRES_USER: ${POSTGRES_USER:-smokemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smokemap}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smokemap-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set download "local/$${MINIO_BUCKET}"
    restart: "no"

  backend:
    build:
      context: ./smokemap-django-backend
      target: development
    init: true
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    environment:
      SETTINGS_MODE: local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-django-secret-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-smokemap}
      POSTGRES_USER: ${POSTGRES_USER:-smokemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smokemap}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_OPTIONS: "-c search_path=smokemap"
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_STORAGE_BUCKET_NAME: ${MINIO_BUCKET:-smokemap-images}
      AWS_S3_ENDPOINT_URL: http://localhost:${MINIO_API_PORT:-9000}
      AWS_S3_ADDRESSING_STYLE: path
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./smokemap-django-backend:/app
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://localhost:8000/health/ready/', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./smokemap-webapp
      target: development
    init: true
    command: yarn dev --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ENVIRONMENT: local
      NEXT_PUBLIC_VERSION: development
      NEXT_PUBLIC_BASE_URL: http://localhost:${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_BACKEND: /api/smokemap
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: /api/smokemap/graphql
      NEXT_PUBLIC_FEATURESERV_ENDPOINT: /api/smokemap/locations
      NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-https://tiles.openfreemap.org/styles/liberty}
      NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-info}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXTAUTH_URL: http://localhost:${FRONTEND_PORT:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-only-nextauth-secret-change-me}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      GRAPHQL_INTERNAL_ENDPOINT: ${GRAPHQL_INTERNAL_ENDPOINT:-http://backend:8000/graphql/}
      GRAPHQL_SCHEMA_URL: http://backend:8000/graphql/
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./smokemap-webapp:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
  frontend-next-cache:
