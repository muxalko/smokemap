# Local-staging TLS edge. The two origins are fixed by the local-staging
# contract and pinned by scripts/validate-local-staging.py.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Log the path without its query string: signed preview URLs carry their
    # signature there, and presigned form fields must never be logged.
    log_format edge '$remote_addr [$time_iso8601] $host "$request_method $uri" '
                    '$status $body_bytes_sent $request_time';
    access_log /dev/stdout edge;

    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS. Upstreams are variables so a container recreated
    # by a rollback is re-resolved instead of pinned to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/edge_tls_certificate;
    ssl_certificate_key /run/secrets/edge_tls_private_key;

    # Preserve the exact Host, including its port: MinIO verifies signed
    # requests against it and the frontend checks server-action origins with
    # it. Client forwarding headers are replaced, never appended.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";

    # Unknown TLS names never complete a handshake, and a known name with an
    # unknown Host is misdirected.
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }

    server {
        listen 8443 ssl;
        server_name app.local-staging.smokemap.internal;
        if ($host != $ssl_server_name) {
            return 421;
        }
        client_max_body_size 2m;

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
        }
    }

    server {
        listen 8443 ssl;
        server_name media.local-staging.smokemap.internal;
        if ($host != $ssl_server_name) {
            return 421;
        }
        # The backend signs uploads of at most 5,000,000 bytes; the rest is
        # multipart form overhead. MinIO enforces the signed range itself.
        client_max_body_size 6m;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            set $storage_upstream http://storage:9000;
            proxy_pass $storage_upstream;
        }
    }

    # Container-local health listener; it is not published.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
