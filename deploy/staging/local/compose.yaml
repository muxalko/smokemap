# Local-staging overlay for ../compose.yaml. Render or run it only through
# scripts/local-staging.py, which pins the project name, scrubs the caller's
# environment, and supplies the operator settings plus the selected release.
#
# Local staging keeps the reviewed staging topology but replaces the
# Cloudflare tunnel with a loopback-only TLS edge, and runs content-addressed
# local image IDs that are never pulled at startup. README.md in this
# directory is the runbook.

x-local-image: &local-image
  pull_policy: never

# Application images already run as UID/GID 10001; pinning the user here keeps
# a drifted image from silently running as root.
x-app-hardening: &app-hardening
  pull_policy: never
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    <<: *local-image

  storage:
    <<: *local-image

  storage-init:
    <<: *local-image

  migrate:
    <<: *app-hardening

  backend:
    <<: *app-hardening

  media-cleanup:
    <<: *app-hardening

  frontend:
    <<: *app-hardening

  # The tunnel connector is the external ingress. Local commands never select
  # this profile, so it is absent from every local rendering and run.
  cloudflared:
    profiles: !override [staging-cloudflare]

  # TLS edge for the separate application and media origins. It is the only
  # service with a published port, bound to loopback, and reaches only the
  # frontend and the MinIO API through the internal ingress networks.
  edge:
    profiles: [staging-runtime]
    image: ${EDGE_PROXY_IMAGE:?Set the local edge proxy image ID}
    pull_policy: never
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    entrypoint: [nginx, -c, /etc/nginx/smokemap-local-staging.conf, -g, daemon off;]
    configs:
      - source: edge_nginx
        target: /etc/nginx/smokemap-local-staging.conf
    secrets:
      - edge_tls_certificate
      - edge_tls_private_key
    group_add:
      - ${STAGING_SECRET_GID:?Set the numeric group allowed to read staging secrets}
    ports:
      - name: https
        target: 8443
        host_ip: 127.0.0.1
        published: "${LOCAL_STAGING_HTTPS_PORT:?Set the loopback HTTPS port}"
        protocol: tcp
    networks:
      - edge
      - ingress
      - media-ingress
    depends_on:
      frontend:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

secrets:
  edge_tls_certificate:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/edge_tls_certificate
  edge_tls_private_key:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/edge_tls_private_key

configs:
  # Relative to deploy/staging, the directory of the first Compose file.
  edge_nginx:
    file: ./local/nginx.conf
