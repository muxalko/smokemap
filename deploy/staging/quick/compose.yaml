# Explicit quick mode only; never layer onto development or local staging.
x-app: &app
  pull_policy: never
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-connector: &connector
  profiles: [quick-connectors]
  image: ${CLOUDFLARED_IMAGE:?Set the reviewed official cloudflared digest}
  pull_policy: never
  entrypoint: [cloudflared, --no-autoupdate]
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Fail closed on exit. A new process obtains a different public origin.
  restart: "no"
  # Even a future fatal error must not write request query strings to Docker.
  logging:
    driver: none

services:
  db:
    pull_policy: never
  storage:
    pull_policy: never
  storage-init:
    pull_policy: never
  migrate:
    <<: *app
  backend:
    <<: *app
  media-cleanup:
    <<: *app
  frontend:
    <<: *app
  # Disabled named-token connector is never selected by this operator.
  cloudflared:
    profiles: !override [disabled-named-tunnel]
  quick-app:
    <<: *connector
    command: [tunnel, --loglevel, fatal, --metrics, "0.0.0.0:2000", --url, "http://frontend:3000"]
    networks: [edge, ingress]
  quick-media:
    <<: *connector
    command: [tunnel, --loglevel, fatal, --metrics, "0.0.0.0:2000", --url, "http://storage:9000"]
    networks: [edge, media-ingress]
