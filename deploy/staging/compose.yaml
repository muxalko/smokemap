name: ${COMPOSE_PROJECT_NAME:?Set a dedicated staging Compose project name}

x-runtime-profile: &runtime-profile
  profiles: [staging-runtime]

x-secret-groups: &secret-groups
  - ${STAGING_SECRET_GID:?Set the numeric group allowed to read staging secrets}

# The backend staging settings reject development service names such as
# backend, db, and storage. Backend-facing connections therefore use these
# fixed private network aliases, which the preflight pins exactly.
x-backend-environment: &backend-environment
  SETTINGS_MODE: staging
  DJANGO_ALLOWED_HOSTS: api.smokemap-staging.internal
  DJANGO_TRUST_X_FORWARDED_PROTO: "true"
  POSTGRES_DB: ${POSTGRES_DB:?Set the staging database name}
  POSTGRES_USER: ${POSTGRES_USER:?Set the staging database user}
  POSTGRES_HOST: postgis.smokemap-staging.internal
  POSTGRES_PORT: "5432"
  # Keep application DDL in smokemap and expose the image's public PostGIS types.
  POSTGRES_OPTIONS: -c search_path=smokemap,public
  POSTGRES_SSLMODE: verify-full
  PGSSLROOTCERT: /run/secrets/postgres_tls_ca
  CORS_ALLOWED_ORIGINS: ${STAGING_APP_URL:?Set the public staging application URL}
  CSRF_TRUSTED_ORIGINS: ${STAGING_APP_URL:?Set the public staging application URL}
  AWS_REGION: ${AWS_REGION:?Set the object-storage region}
  AWS_STORAGE_BUCKET_NAME: ${MINIO_BUCKET:?Set the public media bucket}
  AWS_S3_ENDPOINT_URL: ${STAGING_MEDIA_URL:?Set the public staging media URL}
  AWS_S3_ADDRESSING_STYLE: path
  MEDIA_STORAGE_BUCKET_NAME: ${MINIO_PRIVATE_MEDIA_BUCKET:?Set the private source-media bucket}
  MEDIA_STORAGE_IDENTIFIER: smokemap-staging-private-media-v1
  MEDIA_STORAGE_INTERNAL_ENDPOINT_URL: http://objects.smokemap-staging.internal:9000
  MEDIA_UPLOAD_ENDPOINT_URL: ${STAGING_MEDIA_URL:?Set the public staging media URL}

x-backend-secrets: &backend-secrets
  - django_secret_key
  - postgres_password
  - postgres_tls_ca
  - storage_access_key
  - storage_secret_key

x-backend-command: &backend-command
  - /bin/sh
  - -ec
  - |
    export DJANGO_SECRET_KEY="$$(cat /run/secrets/django_secret_key)"
    export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
    export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/storage_access_key)"
    export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/storage_secret_key)"
    exec "$$@"
  - staging-entrypoint

services:
  db:
    <<: *runtime-profile
    image: ${POSTGIS_IMAGE:?Set an immutable PostGIS image digest}
    # PostgreSQL refuses a private key that is not owned by its own user or
    # root, and the image entrypoint drops the supplemental secret group.
    # Copy the TLS pair to a memory-backed directory before the entrypoint
    # starts the server as postgres.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        install -d -m 0700 -o postgres -g postgres /run/postgresql-tls
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_tls_certificate /run/postgresql-tls/server.crt
        install -m 0600 -o postgres -g postgres /run/secrets/postgres_tls_private_key /run/postgresql-tls/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/run/postgresql-tls/server.crt -c ssl_key_file=/run/postgresql-tls/server.key
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the staging database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the staging database user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - postgres_tls_certificate
      - postgres_tls_private_key
    group_add: *secret-groups
    tmpfs:
      - /run/postgresql-tls
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/00-create-smokemap-schema.sql
    networks:
      database:
        aliases: [postgis.smokemap-staging.internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  storage:
    <<: *runtime-profile
    image: ${MINIO_IMAGE:?Set an immutable MinIO image digest}
    command: [server, /data]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_API_CORS_ALLOW_ORIGIN: ${STAGING_APP_URL:?Set the public staging application URL}
      MINIO_BROWSER: "off"
    secrets:
      - minio_root_user
      - minio_root_password
    group_add: *secret-groups
    volumes:
      - minio-data:/data
    networks:
      media:
        aliases: [objects.smokemap-staging.internal]
      media-ingress: {}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  storage-init:
    <<: *runtime-profile
    image: ${MINIO_CLIENT_IMAGE:?Set an immutable MinIO client image digest}
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?Set the public media bucket}
      MINIO_PRIVATE_MEDIA_BUCKET: ${MINIO_PRIVATE_MEDIA_BUCKET:?Set the private source-media bucket}
    secrets:
      - minio_root_user
      - minio_root_password
      - storage_access_key
      - storage_secret_key
    group_add: *secret-groups
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        root_user="$$(cat /run/secrets/minio_root_user)"
        root_password="$$(cat /run/secrets/minio_root_password)"
        storage_access_key="$$(cat /run/secrets/storage_access_key)"
        storage_secret_key="$$(cat /run/secrets/storage_secret_key)"
        test "$${MINIO_BUCKET}" != "$${MINIO_PRIVATE_MEDIA_BUCKET}"
        mc alias set local http://storage:9000 "$${root_user}" "$${root_password}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        policy_file="$$(mktemp)"
        trap 'rm -f "$${policy_file}"' EXIT
        cat >"$${policy_file}" <<PUBLIC_READ_POLICY
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$${MINIO_BUCKET}/*"]}
        ]}
        PUBLIC_READ_POLICY
        mc anonymous set-json "$${policy_file}" "local/$${MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_MEDIA_BUCKET}"
        mc anonymous set private "local/$${MINIO_PRIVATE_MEDIA_BUCKET}"
        mc admin user add local "$${storage_access_key}" "$${storage_secret_key}"
        cat >"$${policy_file}" <<POLICY
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::$${MINIO_BUCKET}","arn:aws:s3:::$${MINIO_PRIVATE_MEDIA_BUCKET}"]},
          {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$${MINIO_BUCKET}/*","arn:aws:s3:::$${MINIO_PRIVATE_MEDIA_BUCKET}/*"]},
          {"Effect":"Allow","Action":["s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$${MINIO_PRIVATE_MEDIA_BUCKET}/*"]}
        ]}
        POLICY
        mc admin policy create local smokemap-staging "$${policy_file}"
        mc admin policy attach local smokemap-staging --user "$${storage_access_key}"
    networks:
      - media
    restart: "no"

  # Single-writer release job. It needs the runtime profile for db and
  # storage-init, so run it only with the exact command in README.md.
  migrate:
    image: ${BACKEND_IMAGE:?Set an immutable backend image digest}
    profiles: [staging-migration]
    entrypoint: *backend-command
    command:
      - /bin/sh
      - -ec
      - |
        python manage.py check --deploy
        python manage.py migrate --noinput
    environment: *backend-environment
    secrets: *backend-secrets
    group_add: *secret-groups
    networks:
      - database
      - application
      - media
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *runtime-profile
    image: ${BACKEND_IMAGE:?Set an immutable backend image digest}
    entrypoint: *backend-command
    command: [gunicorn, --bind=0.0.0.0:8000, --workers=2, --threads=4, --timeout=60, --access-logfile=-, --error-logfile=-, smokemap.wsgi:app]
    environment: *backend-environment
    secrets: *backend-secrets
    group_add: *secret-groups
    networks:
      database: {}
      application:
        aliases: [api.smokemap-staging.internal]
      media: {}
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      # Ignored for the runtime-only profile. If both profiles are ever
      # selected together, the web process still waits for the migration job
      # instead of serving while the schema changes.
      migrate:
        condition: service_completed_successfully
        required: false
    healthcheck:
      # Staging redirects plain HTTP and rejects unknown hosts, so the probe
      # presents the allowed alias and the trusted proxy header.
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'Host': 'api.smokemap-staging.internal', 'X-Forwarded-Proto': 'https'}), timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  media-cleanup:
    <<: *runtime-profile
    image: ${BACKEND_IMAGE:?Set an immutable backend image digest}
    entrypoint: *backend-command
    command:
      - /bin/sh
      - -ec
      - |
        case "$${MEDIA_CLEANUP_BATCH_SIZE}" in ''|*[!0-9]*|0) exit 64 ;; esac
        case "$${MEDIA_CLEANUP_INTERVAL_SECONDS}" in ''|*[!0-9]*|0) exit 64 ;; esac
        while true; do
          python manage.py process_media_cleanup --batch-size "$${MEDIA_CLEANUP_BATCH_SIZE}" || true
          sleep "$${MEDIA_CLEANUP_INTERVAL_SECONDS}"
        done
    environment:
      <<: *backend-environment
      MEDIA_CLEANUP_BATCH_SIZE: ${MEDIA_CLEANUP_BATCH_SIZE:?Set a positive cleanup batch size}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:?Set a positive cleanup interval}
    secrets: *backend-secrets
    group_add: *secret-groups
    networks:
      - database
      - media
    depends_on:
      backend:
        condition: service_healthy
    # This loop runs no HTTP server. Disable the production backend image's
    # web healthcheck; Compose --wait requires only a running worker process.
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    <<: *runtime-profile
    image: ${FRONTEND_IMAGE:?Set an immutable frontend image digest}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ENVIRONMENT: staging
      NEXT_PUBLIC_VERSION: ${RELEASE_VERSION:?Set the immutable release identifier}
      NEXT_PUBLIC_BASE_URL: ${STAGING_APP_URL:?Set the public staging application URL}
      NEXT_PUBLIC_BACKEND: /api/smokemap
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: /api/smokemap/graphql
      NEXT_PUBLIC_FEATURESERV_ENDPOINT: /api/smokemap/locations
      NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:?Set the public map style URL}
      NEXT_PUBLIC_LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXTAUTH_URL: ${STAGING_APP_URL:?Set the public staging application URL}
      BACKEND_INTERNAL_URL: http://api.smokemap-staging.internal:8000
      GRAPHQL_INTERNAL_ENDPOINT: http://api.smokemap-staging.internal:8000/graphql/
    secrets:
      - nextauth_secret
    group_add: *secret-groups
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export NEXTAUTH_SECRET="$$(cat /run/secrets/nextauth_secret)"
        exec yarn start --hostname 0.0.0.0 --port 3000
    networks:
      - application
      - ingress
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  cloudflared:
    <<: *runtime-profile
    image: ${CLOUDFLARED_IMAGE:?Set an immutable cloudflared image digest}
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflared_token]
    secrets:
      - cloudflared_token
    group_add: *secret-groups
    networks:
      - edge
      - ingress
      - media-ingress
    depends_on:
      frontend:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped

secrets:
  cloudflared_token:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/cloudflared_token
  django_secret_key:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/django_secret_key
  minio_root_password:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/minio_root_password
  minio_root_user:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/minio_root_user
  nextauth_secret:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/nextauth_secret
  postgres_password:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/postgres_password
  postgres_tls_ca:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/postgres_tls_ca
  postgres_tls_certificate:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/postgres_tls_certificate
  postgres_tls_private_key:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/postgres_tls_private_key
  storage_access_key:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/storage_access_key
  storage_secret_key:
    file: ${STAGING_SECRETS_DIR:?Set the absolute staging secret directory}/storage_secret_key

configs:
  postgres_init:
    file: ../../docker/postgres/init/00-create-smokemap-schema.sql

volumes:
  minio-data:
  postgres-data:

networks:
  application:
    internal: true
  database:
    internal: true
  edge:
  ingress:
    internal: true
  media:
    internal: true
  media-ingress:
    internal: true
